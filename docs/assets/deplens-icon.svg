<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DepLens">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"/>
    </pattern>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <g stroke="#000000" stroke-width="16">
        <line x1="168" y1="96" x2="214" y2="196"/>
        <line x1="116" y1="318" x2="196" y2="286"/>
        <line x1="300" y1="418" x2="278" y2="328"/>
        <line x1="412" y1="226" x2="328" y2="246"/>
      </g>
      <circle cx="256" cy="256" r="78" fill="#000000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A2A66" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#2F7DE1"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)"/>
  <g filter="url(#shadow)">
    <g transform="translate(256 256) scale(1.2) translate(-256 -256)">
      <path d="M120 100 H252 A156 156 0 0 1 252 412 H120 Z" fill="#FFFFFF" mask="url(#cut)"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="29" fill="#FF8A3D"/>
</svg>
